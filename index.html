<!doctype html>
<html lang="id" data-tema="gelap">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kelas G · Kenangan Kita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" href="img/logo.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bar"></div>
<div id="float" aria-hidden="true"></div>

<nav class="nav glass" id="nav">
  <a href="#beranda" class="logo" aria-label="Beranda"><img src="img/logo.svg" alt="" onerror="this.remove()"><b>G</b></a>
  <div class="links"><i class="pill"></i>
    <a href="#beranda">Beranda</a><a href="#wali">Wali Kelas</a><a href="#siswa">Siswa</a>
    <a href="#galeri">Galeri</a><a href="#linimasa">Linimasa</a><a href="#musik">Musik</a><a href="#pesan">Pesan</a>
  </div>
  <button id="navMusik" aria-label="Putar atau jeda musik">♪</button>
  <button id="tema" aria-label="Ganti tema gelap atau terang">◐</button>
</nav>

<main>
<section id="beranda" class="hero">
  <div class="hero-txt">
    <div class="brand"><img src="img/logo.svg" alt="Logo sekolah" onerror="this.remove()"><p class="sub" id="sekolah"></p></div>
    <h1>Kelas G</h1>
    <p class="typed" id="typed"></p>
    <div class="stats" id="stats"></div>
    <button class="btn" id="kejutan">Kejutan untuk kita</button>
  </div>
  <div class="stack" id="stack"></div>
</section>

<section id="wali">
  <h2>Tiga wali kelas, tiga tahun</h2>
  <p class="lead">Ketuk kartu untuk membaca pesan mereka.</p>
  <div class="grid3" id="waliGrid"></div>
</section>

<section id="siswa">
  <h2>40 teman seperjalanan</h2>
  <div class="tools">
    <input id="cari" type="search" placeholder="Cari nama" aria-label="Cari siswa">
    <button class="chip" id="acak">Acak teman</button>
    <button class="chip" id="favOnly">♥ Favorit saja</button>
  </div>
  <div class="grid" id="siswaGrid"></div>
  <div class="quiz glass">
    <h3>Tebak siapa?</h3>
    <div id="qFoto"></div>
    <div id="qOpt"></div>
    <p id="qSkor">Skor 0/0</p>
  </div>
</section>

<section id="galeri">
  <h2>Foto bersama</h2>
  <div class="tabs" id="tabs"></div>
  <div class="masonry" id="masonry"></div>
</section>

<section id="linimasa">
  <h2>Perjalanan kita</h2>
  <div class="tl" id="tl"></div>
</section>

<section id="musik">
  <h2>Lagu kenangan</h2>
  <div class="player glass">
    <div class="vinyl" id="vinyl"><span></span></div>
    <div class="pinfo">
      <h3 id="jdl"></h3><p id="art"></p>
      <div class="viz" id="viz"></div>
      <div class="prog" id="prog"><i id="fill"></i></div>
      <div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
      <div class="ctrl">
        <button id="shuf" aria-label="Acak">⇄</button>
        <button id="prev" aria-label="Sebelumnya">⏮</button>
        <button id="pp" class="big" aria-label="Putar">▶</button>
        <button id="next" aria-label="Berikutnya">⏭</button>
        <input id="vol" type="range" min="0" max="1" step=".05" value=".7" aria-label="Volume">
      </div>
    </div>
    <ol id="plist"></ol>
  </div>
</section>

<section id="pesan">
  <h2>Buku kenangan</h2>
  <form class="form glass" id="form">
    <input id="pNama" placeholder="Namamu" required maxlength="30">
    <textarea id="pIsi" placeholder="Tulis pesan atau kenangan favoritmu" required maxlength="240"></textarea>
    <button class="btn">Simpan pesan</button>
  </form>
  <div class="grid3" id="pList"></div>
</section>
</main>

<footer>Kelas G · <span id="thn"></span> · Dibuat dengan ♥ oleh kita semua</footer>
<button id="top" aria-label="Kembali ke atas">↑</button>

<dialog id="modal" class="glass"><button class="x" data-x>×</button><div id="mBody"></div>
  <div class="mnav"><button data-d="-1">‹ Sebelumnya</button><button data-d="1">Berikutnya ›</button></div></dialog>
<dialog id="lb" class="glass"><button class="x" data-x>×</button><div id="lbBody"></div>
  <div class="mnav"><button data-l="-1">‹</button><button id="slide">▶ Slideshow</button><button data-l="1">›</button></div></dialog>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
